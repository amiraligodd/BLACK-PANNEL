<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پنل مدیریت</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--a:#7c5cff;--a2:#38d4ff;--r:16px;--fs:15px;--bl:14px;--pad:14px;--avr:13px}
[data-t=dark]{--bg:#0a0c13;--c:rgba(255,255,255,.055);--c2:rgba(255,255,255,.09);--t:#eef0f8;--m:#8d95b0;--b:rgba(255,255,255,.1);--in:rgba(0,0,0,.28)}
[data-t=light]{--bg:#f2f4fb;--c:#fff;--c2:#eef1fa;--t:#171c30;--m:#6a7391;--b:#e0e4f0;--in:#f5f7fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:var(--ff,system-ui,Tahoma,sans-serif);font-size:var(--fs);min-height:100vh;padding:0 0 90px}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
body[data-bg=gradient]::before{inset:0;background:radial-gradient(800px 420px at 85% -5%,color-mix(in srgb,var(--a) 45%,transparent),transparent 65%),radial-gradient(600px 400px at 0 105%,color-mix(in srgb,var(--a2) 28%,transparent),transparent 60%)}
body[data-bg=mesh]::before{inset:0;background:radial-gradient(500px 300px at 10% 10%,color-mix(in srgb,var(--a) 40%,transparent),transparent),radial-gradient(500px 300px at 90% 20%,color-mix(in srgb,var(--a2) 40%,transparent),transparent),radial-gradient(600px 400px at 50% 100%,color-mix(in srgb,var(--a) 30%,transparent),transparent)}
body[data-bg=aurora]::before,body[data-bg=aurora]::after{width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.4}
body[data-bg=aurora]::before{background:var(--a);top:-30vmax;right:-20vmax;animation:fl 18s ease-in-out infinite alternate}
body[data-bg=aurora]::after{background:var(--a2);bottom:-35vmax;left:-25vmax;animation:fl 22s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
body[data-bg=grid]::before{inset:0;background:linear-gradient(var(--b) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--b) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(600px 400px at 50% 0,color-mix(in srgb,var(--a) 25%,transparent),transparent)}
body[data-an=off] *,body[data-an=off]::before,body[data-an=off]::after{animation:none!important;transition:none!important}
body[data-cs=solid] .card{background:var(--c2);backdrop-filter:none}
body[data-cs=outline] .card{background:transparent;border:1.5px solid var(--a);backdrop-filter:none}
body[data-cs=neon] .card{box-shadow:0 0 22px color-mix(in srgb,var(--a) 35%,transparent);border-color:color-mix(in srgb,var(--a) 60%,transparent)}
body[data-d=compact]{--pad:9px}body[data-d=roomy]{--pad:21px}
body[data-ly=grid] #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}body[data-ly=grid] .u{margin:0}
.fab,.btn.p,.chip.on,.av{box-shadow:none}
.w{max-width:900px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
header h1{font-size:20px;margin:0;flex:1;font-weight:800}
.ic{width:42px;height:42px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:18px;cursor:pointer}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl))}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{padding:14px}.st small{color:var(--m);font-size:12px}.st b{display:block;font-size:22px;margin-top:4px}
.st i{font-style:normal;float:left;font-size:20px;opacity:.9}
.bar{display:flex;gap:8px;margin:14px 0 8px}
input,select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--b);background:var(--in);color:var(--t);font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);outline-offset:-1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--m);font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent}
.u{padding:var(--pad);margin:10px 0}
.top{display:flex;align-items:center;gap:11px}
.av{width:42px;height:42px;border-radius:var(--avr);display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2))}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--m)}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:700}
.ok{background:#1fa86a33;color:#35d68a}.no{background:#e5484d33;color:#ff7a80}.off{background:#8d95b033;color:var(--m)}
.pb{height:8px;border-radius:9px;background:var(--in);margin:12px 0 6px;overflow:hidden}
.pb div{height:100%;border-radius:9px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--m)}
.act{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:64px;padding:9px 6px;border-radius:11px;border:1px solid var(--b);background:var(--c2);color:var(--t);font-size:13px;cursor:pointer;font-family:inherit}
.btn.p{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;color:#fff;font-weight:700}
.btn.d{color:#ff7a80}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;height:56px;padding:0 22px;border-radius:99px;border:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:16px;font-weight:800;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 55%,transparent);cursor:pointer}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
.mo.on{display:flex}
.sh{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--b);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.mo{align-items:center}.sh{border-radius:24px}}
.sh h3{margin:0 0 12px}label{display:block;font-size:12.5px;color:var(--m);margin:11px 0 5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw span{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sw span.on{border-color:var(--t)}
#qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:16px;margin:8px auto;width:fit-content}
.lk{font-size:11.5px;word-break:break-all;color:var(--m);background:var(--in);padding:9px;border-radius:10px;margin-top:6px;direction:ltr;text-align:left}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;z-index:50;transition:.3s}
#toast.on{transform:translateX(-50%)}
.wrap{flex-wrap:wrap}.empty{text-align:center;color:var(--m);padding:40px 0}

:root{--gl:.4}
::selection{background:var(--a);color:#fff}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--a) 60%,transparent) transparent}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
#grain{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.08;mix-blend-mode:overlay;display:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body[data-ns="1"] #grain{display:block}
.card{position:relative;transition:transform .25s,box-shadow .25s,border-color .25s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--a) 24%,transparent),transparent 62%)}
body[data-sp="1"] .card:hover::after{opacity:1}
body[data-bd=gradient] .card::before,body[data-bd=animated] .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:linear-gradient(135deg,var(--a),var(--a2),var(--a));background-size:300% 300%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
body[data-bd=animated] .card::before{animation:bd 4s linear infinite}
@keyframes bd{to{background-position:300% 0}}
body[data-hv=lift] .u:hover{transform:translateY(-3px);box-shadow:0 14px 34px -12px color-mix(in srgb,var(--a) calc(var(--gl)*80%),transparent)}
body[data-hv=glow] .u:hover{box-shadow:0 0 calc(10px + var(--gl)*30px) color-mix(in srgb,var(--a) calc(var(--gl)*75%),transparent)}
header h1{font-size:22px;letter-spacing:.3px}
body[data-tf=gradient] .tt,body[data-tf=animated] .tt{background:linear-gradient(90deg,var(--a),var(--a2),var(--a));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
body[data-tf=animated] .tt{animation:tx 4s linear infinite}
@keyframes tx{to{background-position:200% center}}
.st b{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.av{box-shadow:0 4px calc(var(--gl)*22px) color-mix(in srgb,var(--a) calc(var(--gl)*55%),transparent)}
.pb div{box-shadow:0 0 calc(var(--gl)*14px) color-mix(in srgb,var(--a) calc(var(--gl)*70%),transparent)}
.fab{box-shadow:0 10px calc(10px + var(--gl)*28px) color-mix(in srgb,var(--a) calc(20% + var(--gl)*50%),transparent);animation:pl 2.8s ease-in-out infinite}
@keyframes pl{50%{transform:translateY(-3px) scale(1.03)}}
.btn,.chip,.ic{transition:transform .15s,filter .2s}
.btn:active,.chip:active,.ic:active,.fab:active{transform:scale(.95)}
.btn:hover,.chip:hover,.ic:hover{filter:brightness(1.15)}
.tag.ok::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:5px;animation:pd 1.6s infinite}
@keyframes pd{50%{opacity:.25}}
.mo.on .sh{animation:shu .38s cubic-bezier(.2,1.2,.4,1)}
@keyframes shu{from{transform:translateY(40px) scale(.97);opacity:0}}
@keyframes fu{from{opacity:0;transform:translateY(16px)}}
@keyframes sl{from{opacity:0;transform:translateX(-24px)}}
@keyframes pp{from{opacity:0;transform:scale(.88)}}
body[data-en=fade] .ani{animation:fu .55s both;animation-delay:calc(var(--i,0)*45ms)}
body[data-en=slide] .ani{animation:sl .5s both;animation-delay:calc(var(--i,0)*45ms)}
body[data-en=pop] .ani{animation:pp .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0)*45ms)}
.stats>.st:nth-child(2){--i:1}.stats>.st:nth-child(3){--i:2}.stats>.st:nth-child(4){--i:3}
body[data-bt=solid] .btn.p,body[data-bt=solid] .fab,body[data-bt=solid] .chip.on{background:var(--a)}
body[data-bt=pill] .btn,body[data-bt=pill] .fab,body[data-bt=pill] .chip,body[data-bt=pill] .ic{border-radius:99px}
body[data-bt=outline] .btn.p,body[data-bt=outline] .fab,body[data-bt=outline] .chip.on{background:transparent;color:var(--a);border:2px solid var(--a);box-shadow:none}
.gp{border:1px solid var(--b);border-radius:14px;padding:2px 12px 12px;margin:10px 0;background:var(--c)}
.gp summary{cursor:pointer;padding:11px 0;font-weight:700}

header{position:sticky;top:0;z-index:15;margin:-14px -14px 12px;padding:12px 14px;-webkit-backdrop-filter:blur(var(--bl));backdrop-filter:blur(var(--bl));background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--b)}
#mc{z-index:40}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mh h3{margin:0}.mh small{color:var(--m)}
.mi{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 6px calc(var(--gl)*22px) color-mix(in srgb,var(--a) calc(var(--gl)*60%),transparent)}
.x{margin-inline-start:auto;width:38px;height:38px;flex:none;border-radius:12px;border:1px solid var(--b);background:var(--c2);color:var(--t);cursor:pointer;font-size:16px}
.sec{border:1px solid var(--b);background:var(--c);border-radius:var(--r);padding:12px;margin:10px 0}
.sec h4{margin:0 0 8px;font-size:14px}
.sumc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:var(--r);border:1px solid var(--b);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 16%,transparent),color-mix(in srgb,var(--a2) 10%,transparent))}
.sumc div{text-align:center}.sumc b{display:block;font-size:16px}.sumc small{color:var(--m);font-size:11px}
.sumc .wide{grid-column:1/-1;border-top:1px dashed var(--b);padding-top:8px}
.ptiles,.tpls,.lks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lks{grid-template-columns:repeat(3,1fr)}
.pt,.tp{padding:11px;border:1.5px solid var(--b);border-radius:14px;cursor:pointer;background:var(--in);transition:.2s;position:relative}
.pt b,.tp b{display:block}.pt small,.tp small{color:var(--m);font-size:11.5px}
.pt.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 15%,transparent)}
.pt.on::after{content:"✓";position:absolute;top:6px;left:9px;color:var(--a);font-weight:900}
.tp{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 18%,transparent),transparent)}.tp:active,.pt:active{transform:scale(.96)}
.lk2{padding:15px 8px;border-radius:14px;color:#fff;font-weight:800;text-align:center;cursor:pointer;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.45);transition:.2s}.lk2:hover{transform:scale(1.05)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw2{width:48px;height:27px;border-radius:99px;background:var(--in);border:1px solid var(--b);position:relative;cursor:pointer;flex:none;transition:.25s}
.sw2 i{position:absolute;top:2px;right:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.25s}
.sw2.on{background:var(--a)}.sw2.on i{right:24px}
.big{font-size:22px;font-weight:800;text-align:center}
input[type=range]{accent-color:var(--a);padding:0;margin-top:8px}
.stk{position:sticky;bottom:-18px;margin:14px -18px -18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 38%)}
.stk .btn{padding:13px 6px;font-size:15px}
.empty p{margin:6px 0 14px}
.ats{display:none;margin-top:8px;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.7}
.ats.ok,.ats.bad,.ats.warn,.ats.run{display:block}
.ats.ok{background:#1fa86a33;color:#35d68a}.ats.bad{background:#e5484d33;color:#ff7a80}.ats.warn{background:#f59e0b33;color:#fbbf24}.ats.run{background:var(--in);color:var(--m)}
.fok{outline:2px solid #22c55e!important;outline-offset:-1px}.fbad{outline:2px solid #ef4444!important;outline-offset:-1px}
</style>
</head>
<body data-bg="gradient" data-an="on">
<canvas id="fx"></canvas><div id="grain"></div>
<div class="w">
  <header>
    <h1 id="ttl">🛰️ پنل مدیریت</h1>
    <button class="ic" onclick="openDiag()" title="عیب‌یابی">🩺</button>
    <button class="ic" onclick="openSet()" title="تنظیمات">⚙️</button>
    <button class="ic" onclick="location='/logout'" title="خروج">🚪</button>
  </header>

  <div class="stats">
    <div class="card st ani"><i>👥</i><small>کل کاربران</small><b id="s1">–</b></div>
    <div class="card st ani"><i>✅</i><small>فعال</small><b id="s2">–</b></div>
    <div class="card st ani"><i>📊</i><small>کل مصرف</small><b id="s3">–</b></div>
    <div class="card st ani"><i>🖥️</i><small>رم / بار سرور</small><b id="s4" style="font-size:17px">–</b></div>
  </div>

  <div id="errb" class="ats" style="margin-top:10px"></div>
  <div class="bar"><input id="q" placeholder="🔎 جستجوی کاربر یا یادداشت..." oninput="render()"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<button class="fab" onclick="openUser()">＋ کاربر جدید</button>

<div class="mo" id="mu" onclick="if(event.target===this)cl('mu')"><div class="sh" id="mub"></div></div>
<div class="mo" id="mq" onclick="if(event.target===this)cl('mq')"><div class="sh" id="mqb" style="text-align:center"></div></div>
<div class="mo" id="ms" onclick="if(event.target===this)closeSet()"><div class="sh" id="sb"></div></div>
<div class="mo" id="mc"><div class="sh" id="mcb"></div></div>
<div class="mo" id="md" onclick="if(event.target===this)cl('md')"><div class="sh" id="mdb"></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(r.status===401){location='/login';throw 0}return r.json()};
const GB=1073741824,fb=x=>x>=GB?(x/GB).toFixed(2)+' GB':(x/1048576).toFixed(1)+' MB';
const COLORS=['#7c5cff','#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#a855f7'];
let users=[],S={},filt='all',editId=null,qs='',qv='';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function cl(id){$(id).classList.remove('on')}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('✅ کپی شد')}

const FONTS={system:'system-ui,Tahoma,sans-serif',vazir:'Vazirmatn,Tahoma,sans-serif',tahoma:'Tahoma,sans-serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
const PAL={amoled:['#000000','#f2f2f7','#8a8a93','rgba(255,255,255,.1)','dark'],nord:['#2e3440','#eceff4','#9aa5b8','rgba(255,255,255,.12)','dark'],dracula:['#1e1f29','#f8f8f2','#9aa0c0','rgba(255,255,255,.12)','dark'],abyss:['#04121f','#e6f4ff','rgba(120,190,255,.16)','dark'],wine:['#160a12','#fbeaf1','rgba(255,150,190,.15)','dark'],forest:['#07140d','#e7f7ec','rgba(120,255,170,.14)','dark'],paper:['#f7f5ef','#1d1b16','#6f6a5c','#e5e0d2','light'],sand:['#f6efe6','#2a2118','#7a6a58','#e6d9c6','light'],mint:['#eefaf5','#10281f','#5c7d6f','#d3ece1','light']};
function applyTheme(T=S){window.__T=T;const r=document.documentElement,st=r.style,d=document.body.dataset,P=PAL[T.palette];
 st.setProperty('--a',T.accent);st.setProperty('--a2',T.accent2);st.setProperty('--r',T.radius+'px');
 st.setProperty('--fs',T.fsize+'px');st.setProperty('--bl',T.blur+'px');st.setProperty('--gl',(T.glow??40)/100);
 st.setProperty('--ff',FONTS[T.font]||FONTS.system);
 st.setProperty('--avr',{circle:'50%',squircle:'13px',square:'4px'}[T.shape]||'13px');
 let t=P?P[4]:T.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';r.dataset.t=t;
 ['--bg','--t','--m','--b'].forEach((k,i)=>P?st.setProperty(k,P[i]):st.removeProperty(k));
 st.setProperty('--c',t==='dark'?`rgba(255,255,255,${.02+T.opacity*.0018})`:`rgba(255,255,255,${.4+T.opacity*.006})`);

 const d=await api('GET','/api/diag'),row=(ok,t)=>`<div class="rw"><span>${t}</span><span>${ok?'✅':'❌'}</span></div>`;

 <div class="sec"><h4>پروتکل‌ها</h4>${d.protos.map(p=>`<div class="rw" style="font-size:13px"><span>${PN[p.p]} · پورت ${p.port}</span><span>${p.listen?'✅':'❌'} گوش‌می‌ده · کاربر در Xray ${p.in_xray}/${p.wanted} ${p.in_xray==p.wanted?'✅':'⚠️'}${p.pub?` · مسیر عمومی ${p.pub==='400'?'✅':'❌'} ${p.pub}`:''}</span></div>`).join('')}</div>
 <div class="sec"><h4>پارامترهای لینک جدیدترین کاربر</h4><div class="lk" style="direction:ltr;white-space:pre-wrap">address: ${esc(d.addr)}\nSNI/Host: ${esc(d.dom)}\nport: ${d.port}${d.r_host?`\nreality: ${esc(d.r_host)}:${esc(d.r_port)}`:''}</div></div>
 <div class="act stk"><button class="btn p" onclick="xr()">🔄 ری‌استارت Xray</button><button class="btn" onclick="openDiag()">بررسی دوباره</button></div>`}
async function xr(){await api('POST','/api/xray/restart');toast('✅ Xray ری‌استارت شد');openDiag()}
function ask(msg,ok='تأیید'){return new Promise(res=>{$('mcb').innerHTML=`<div class="mh"><div class="mi">❓</div><h3>${msg}</h3></div><div class="act"><button class="btn p" id="mc_y">${ok}</button><button class="btn" id="mc_n">انصراف</button></div>`;
 const f=v=>{cl('mc');res(v)};$('mc_y').onclick=()=>f(true);$('mc_n').onclick=()=>f(false);$('mc').onclick=e=>{if(e.target.id==='mc')f(false)};$('mc').classList.add('on')})}
async function up(i,b){await api('PUT','/api/users/'+i,b);load()}
async function rm(i){if(await ask('این کاربر حذف شود؟','حذف')){await api('DELETE','/api/users/'+i);load()}}
let QL=[],QI=0;
function qr(id){const u=users.find(x=>x.id===id);qs=location.origin+'/sub/'+u.token;QL=[{p:'sub',l:qs},...u.links];
 $('mqb').innerHTML=`<div class="mh"><div class="mi">📲</div><div style="text-align:right"><h3>${esc(u.name)}</h3><small>${fb(u.up+u.down)} / ${u.limit_bytes?fb(u.limit_bytes):'♾️'}</small></div><button class="x" onclick="cl('mq')">✕</button></div>
 <div class="chips wrap" style="justify-content:center" id="qtabs">${QL.map((x,i)=>`<div class="chip" onclick="showT(${i})">${x.p==='sub'?'🔗 ساب':PN[x.p]}</div>`).join('')}</div>
 <div id="qr"></div><div class="lk" id="ql"></div>
 <div class="act stk"><button class="btn p" onclick="cp(QL[QI].l)">📋 کپی</button><button class="btn" onclick="shareQ()">📤 اشتراک</button></div>`;
 $('mq').classList.add('on');showT(0)}
function showT(i){QI=i;document.querySelectorAll('#qtabs .chip').forEach((c,j)=>c.classList.toggle('on',j===i));showQ(QL[i].l)}
function shareQ(){const t=QL[QI].l;navigator.share?navigator.share({text:t}).catch(()=>{}):cp(t)}
function showQ(t){$('qr').innerHTML='';$('ql').textContent=t;if(window.QRCode)new QRCode($('qr'),{text:t,width:210,height:210,correctLevel:QRCode.CorrectLevel.L})}

const PRE={midnight:['#7c5cff','#38d4ff','نیمه‌شب'],ocean:['#0ea5e9','#22d3ee','اقیانوس'],aurora:['#10b981','#6366f1','شفق'],sunset:['#f97316','#ec4899','غروب'],rose:['#f43f5e','#fb923c','رز'],forest:['#22c55e','#a3e635','جنگل'],gold:['#f59e0b','#ef4444','طلا'],violet:['#a855f7','#ec4899','بنفش'],cyber:['#00f5d4','#9b5de5','سایبر'],mono:['#94a3b8','#e2e8f0','مونو']};
const OPT={theme:['حالت تم',[['dark','تیره'],['light','روشن'],['auto','خودکار']]],
 palette:['پالت رنگی کل صفحه',[['default','پیش‌فرض (طبق حالت تم)'],['amoled','آمولد سیاه'],['nord','نورد'],['dracula','دراکولا'],['abyss','اعماق دریا'],['wine','شراب'],['forest','جنگل شب'],['paper','کاغذ (روشن)'],['sand','شنی (روشن)'],['mint','نعنایی (روشن)']]],
 bg:['پس‌زمینه',[['gradient','گرادیانت'],['mesh','مش'],['aurora','شفق متحرک'],['grid','شبکه'],['photo','عکس'],['plain','ساده']]],
 fx:['افکت ذرات متحرک',[['none','بدون'],['stars','ستاره‌ها'],['snow','برف'],['matrix','ماتریکس'],['fireflies','کرم شب‌تاب'],['bubbles','حباب']]],
 noise:['بافت دانه‌دار',[['0','خاموش'],['1','روشن']]],
 cardstyle:['سبک کارت',[['glass','شیشه‌ای'],['solid','تخت'],['outline','خط‌دار'],['neon','نئون']]],
 border:['حاشیه کارت',[['normal','معمولی'],['gradient','گرادیانت'],['animated','گرادیانت متحرک']]],
 hover:['حالت هاور',[['lift','بالا آمدن'],['glow','درخشش'],['none','بدون']]],
 spot:['نور دنبال‌کننده‌ی انگشت/ماوس',[['1','روشن'],['0','خاموش']]],
 btn:['سبک دکمه‌ها',[['gradient','گرادیانت'],['solid','تک‌رنگ'],['pill','قرصی'],['outline','خط‌دار']]],
 titlefx:['افکت عنوان',[['gradient','گرادیانت'],['animated','گرادیانت متحرک'],['plain','ساده']]],
 shape:['شکل آواتار',[['circle','دایره'],['squircle','گرد'],['square','مربع']]],
 pbar:['نوار مصرف',[['gradient','گرادیانت'],['status','رنگ وضعیت'],['striped','راه‌راه']]],
 layout:['چیدمان کاربران',[['list','لیستی'],['grid','شبکه‌ای']]],
 density:['تراکم',[['compact','فشرده'],['normal','معمولی'],['roomy','باز']]],
 enter:['انیمیشن ورود کارت‌ها',[['fade','محو شدن'],['slide','لغزش'],['pop','پاپ'],['none','بدون']]],
 anim:['انیمیشن‌ها',[['1','روشن'],['0','خاموش']]],
 font:['فونت',[['system','سیستم'],['vazir','وزیرمتن'],['tahoma','Tahoma'],['mono','Mono']]]};
const RNG={fsize:['اندازه متن',12,19],radius:['گردی گوشه‌ها',2,32],blur:['شدت بلور',0,40],opacity:['شفافیت کارت‌ها',0,100],glow:['شدت درخشش',0,100]};
const GRP=[['🎨 رنگ و تم',['palette','theme','glow'],1],['🖼️ پس‌زمینه و افکت',['bg','fx','noise','blur']],['🃏 کارت‌ها',['cardstyle','border','hover','spot','radius','opacity']],['🔘 دکمه، عنوان و آواتار',['btn','titlefx','shape','pbar']],['📐 چیدمان و حرکت',['layout','density','enter','anim']],['🔤 متن',['font','fsize']]];
const DEF={accent:'#7c5cff',accent2:'#38d4ff',theme:'dark',palette:'default',radius:'16',bg:'gradient',fx:'none',noise:'0',cardstyle:'glass',border:'normal',hover:'lift',spot:'1',btn:'gradient',titlefx:'gradient',shape:'squircle',pbar:'gradient',layout:'list',density:'normal',enter:'fade',anim:'1',font:'system',fsize:'15',blur:'14',opacity:'40',glow:'40',bgimg:''};
const LOOKS={cyber:['⚡ سایبرپانک',{palette:'amoled',accent:'#00f5d4',accent2:'#9b5de5',fx:'matrix',bg:'plain',cardstyle:'neon',border:'animated',font:'mono',titlefx:'animated',glow:'70'}],
 aurora:['🌌 شفق شمالی',{palette:'abyss',accent:'#10b981',accent2:'#6366f1',bg:'aurora',border:'gradient',titlefx:'animated',glow:'50'}],
 space:['🚀 فضایی',{palette:'amoled',accent:'#a855f7',accent2:'#38d4ff',fx:'stars',border:'gradient',glow:'60'}],
 sunset:['🌇 غروب',{palette:'wine',accent:'#f97316',accent2:'#ec4899',bg:'mesh',fx:'fireflies',border:'gradient',glow:'55'}],
 snow:['❄️ زمستان',{palette:'abyss',accent:'#0ea5e9',accent2:'#e0f2fe',fx:'snow',glow:'35'}],
 royal:['👑 سلطنتی',{palette:'amoled',accent:'#f59e0b',accent2:'#ef4444',bg:'plain',cardstyle:'outline',border:'gradient',titlefx:'animated',glow:'60'}],
 matrix:['🟢 ماتریکس',{palette:'amoled',accent:'#22c55e',accent2:'#a3e635',fx:'matrix',bg:'plain',cardstyle:'outline',font:'mono',glow:'65'}],
 clean:['🤍 مینیمال',{palette:'paper',accent:'#4f46e5',accent2:'#06b6d4',bg:'plain',cardstyle:'solid',titlefx:'plain',hover:'lift',glow:'0',spot:'0'}],
 candy:['🍬 آبنباتی',{palette:'mint',accent:'#ec4899',accent2:'#8b5cf6',bg:'mesh',fx:'bubbles',border:'gradient',glow:'40'}]};
const LB={palette:'default',theme:'dark',bg:'gradient',fx:'none',noise:'0',cardstyle:'glass',border:'normal',hover:'lift',spot:'1',btn:'gradient',titlefx:'gradient',font:'system',glow:'40',enter:'fade'};
const g=k=>S[k]??DEF[k];
function fld(k){const o=OPT[k],r=RNG[k];return o?`<label>${o[0]}</label><select id="s_${k}">${o[1].map(([a,b])=>`<option value="${a}">${b}</option>`).join('')}</select>`:`<label>${r[0]}: <b id="v_${k}">${g(k)}</b></label><input id="s_${k}" type="range" min="${r[1]}" max="${r[2]}" value="${g(k)}">`}
function openSet(){
 const col=(k,n)=>`<div><label>${n}</label><input id="s_${k}" type="color" value="${g(k)}" style="height:44px;padding:4px"></div>`;
 $('sb').innerHTML=`<div class="mh"><div class="mi">🎨</div><div><h3>استودیوی ظاهر</h3><small>تغییرها زنده دیده می‌شن</small></div><button class="x" onclick="closeSet()">✕</button></div><label>عنوان پنل</label><input id="s_title" value="${esc(S.title)}">
 <label>✨ ظاهرهای آماده (یک‌ضربه)</label><div class="lks">${Object.entries(LOOKS).map(([k,[n,o]])=>`<div class="lk2" style="background:linear-gradient(135deg,${o.accent||'#7c5cff'},${o.accent2||'#38d4ff'})" onclick="look('${k}')">${n}</div>`).join('')}</div>
 <label>رنگ‌های آماده</label><div class="sw">${Object.entries(PRE).map(([k,[a,b,n]])=>`<span title="${n}" style="background:linear-gradient(135deg,${a},${b})" onclick="pre('${k}')"></span>`).join('')}</div>
 <div class="row">${col('accent','رنگ اصلی')}${col('accent2','رنگ دوم')}</div>
 ${GRP.map(([t,ks,op])=>`<details class="gp" ${op?'open':''}><summary>${t}</summary>${ks.map(k=>fld(k)).join('')}${t.includes('پس‌زمینه')?`<label>آدرس عکس پس‌زمینه (برای حالت «عکس»)</label><input id="s_bgimg" dir="ltr" value="${esc(S.bgimg||'')}" placeholder="https://...">`:''}</details>`).join('')}
 <div class="act"><button class="btn" onclick="cp(JSON.stringify(ap()))">📤 کپی ظاهر</button><button class="btn" onclick="imp()">📥 اعمال از متن</button></div>
 <details class="gp"><summary>🌐 اتصال</summary>
 <label>دامنه ریلوی (SNI و Host)</label><input id="s_domain" dir="ltr" value="${esc(S.domain||S.default_domain)}" placeholder="your-app.up.railway.app">
 <label>آدرس اتصال (IP یا دامنه؛ خالی = آدرس پیش‌فرض کد)</label><div class="row"><input id="s_address" dir="ltr" value="${esc(S.address)}"><button class="btn" style="flex:0 0 88px" onclick="testAddr('s_address','ats2')">🧪 تست</button><button class="btn" style="flex:0 0 88px" onclick="autoFind('s_address','ats2')">🔎 خودکار</button></div><div id="ats2" class="ats"></div>
 <label>کاندیدهای تست خودکار (هر خط یک دامنه که به سرور تو می‌رسه)</label><textarea id="s_cands" dir="ltr" rows="3" placeholder="vpn.mydomain.com">${esc(S.cands||'')}</textarea>
 <div class="row"><div><label>Fingerprint</label><select id="s_fp">${['android','chrome','firefox','safari','ios','random'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div><label>پیشوند نام کانفیگ</label><input id="s_prefix" value="${esc(S.prefix)}"></div></div></details>
 <div class="act stk"><button class="btn p" onclick="saveSet()">💾 ذخیره</button><button class="btn" onclick="resetSet()">پیش‌فرض ظاهر</button><button class="btn" onclick="closeSet()">بستن</button></div>`;
 for(const k in OPT)$('s_'+k).value=g(k);$('s_fp').value=S.fp;
 $('sb').oninput=prev;$('ms').classList.add('on')}
function val(){const T={...S};document.querySelectorAll('#sb [id^=s_]').forEach(e=>T[e.id.slice(2)]=e.value);for(const k in RNG){const e=$('v_'+k);if(e)e.textContent=T[k]}return T}
const prev=()=>applyTheme(val());
const ap=()=>{const o={};document.querySelectorAll('#sb [id^=s_]').forEach(e=>{const k=e.id.slice(2);if(!['domain','address','fp','prefix','title','cands'].includes(k))o[k]=e.value});return o};
function pre(k){$('s_accent').value=PRE[k][0];$('s_accent2').value=PRE[k][1];prev()}
function look(k){const L={...LB,...LOOKS[k][1]};for(const x in L){const e=$('s_'+x);if(e)e.value=L[x]}prev();toast(LOOKS[k][0])}
function imp(){const t=prompt('متن ظاهر رو اینجا بچسبون');if(!t)return;try{const o=JSON.parse(t);for(const k in o){const e=$('s_'+k);if(e)e.value=o[k]}prev();toast('✅ اعمال شد')}catch(e){toast('⚠️ متن معتبر نیست')}}
function closeSet(){cl('ms');applyTheme()}
async function saveSet(){const b={};document.querySelectorAll('#sb [id^=s_]').forEach(e=>b[e.id.slice(2)]=e.value);
 await api('PUT','/api/settings',b);cl('ms');toast('✅ تنظیمات ذخیره شد');load()}
async function resetSet(){if(await ask('ظاهر به پیش‌فرض برگردد؟','بازنشانی')){await api('PUT','/api/settings',DEF);cl('ms');toast('✅ برگشت به پیش‌فرض');load()}}

load();setInterval(load,30000);
</script>
</body>
</html>
