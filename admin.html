<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KING_PANNEL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--a:#7c5cff;--a2:#38d4ff;--r:16px;--fs:15px;--bl:14px;--pad:14px;--avr:13px}
[data-t=dark]{--bg:#0a0c13;--c:rgba(255,255,255,.055);--c2:rgba(255,255,255,.09);--t:#eef0f8;--m:#8d95b0;--b:rgba(255,255,255,.1);--in:rgba(0,0,0,.28)}
[data-t=light]{--bg:#f2f4fb;--c:#fff;--c2:#eef1fa;--t:#171c30;--m:#6a7391;--b:#e0e4f0;--in:#f5f7fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:var(--ff,system-ui,Tahoma,sans-serif);font-size:var(--fs);min-height:100vh;padding:0 0 90px}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
body[data-bg=gradient]::before{inset:0;background:radial-gradient(800px 420px at 85% -5%,color-mix(in srgb,var(--a) 45%,transparent),transparent 65%),radial-gradient(600px 400px at 0 105%,color-mix(in srgb,var(--a2) 28%,transparent),transparent 60%)}
body[data-bg=mesh]::before{inset:0;background:radial-gradient(500px 300px at 10% 10%,color-mix(in srgb,var(--a) 40%,transparent),transparent),radial-gradient(500px 300px at 90% 20%,color-mix(in srgb,var(--a2) 40%,transparent),transparent),radial-gradient(600px 400px at 50% 100%,color-mix(in srgb,var(--a) 30%,transparent),transparent)}
body[data-bg=aurora]::before,body[data-bg=aurora]::after{width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.4}
body[data-bg=aurora]::before{background:var(--a);top:-30vmax;right:-20vmax;animation:fl 18s ease-in-out infinite alternate}
body[data-bg=aurora]::after{background:var(--a2);bottom:-35vmax;left:-25vmax;animation:fl 22s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
body[data-bg=grid]::before{inset:0;background:linear-gradient(var(--b) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--b) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(600px 400px at 50% 0,color-mix(in srgb,var(--a) 25%,transparent),transparent)}
body[data-an=off] *,body[data-an=off]::before,body[data-an=off]::after{animation:none!important;transition:none!important}
body[data-cs=solid] .card{background:var(--c2);backdrop-filter:none}
body[data-cs=outline] .card{background:transparent;border:1.5px solid var(--a);backdrop-filter:none}
body[data-cs=neon] .card{box-shadow:0 0 22px color-mix(in srgb,var(--a) 35%,transparent);border-color:color-mix(in srgb,var(--a) 60%,transparent)}
body[data-d=compact]{--pad:9px}body[data-d=roomy]{--pad:21px}
body[data-ly=grid] #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}body[data-ly=grid] .u{margin:0}
.fab,.btn.p,.chip.on,.av{box-shadow:none}
.w{max-width:900px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
header h1{font-size:20px;margin:0;flex:1;font-weight:800}
.ic{width:42px;height:42px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:18px;cursor:pointer}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl))}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{padding:14px}.st small{color:var(--m);font-size:12px}.st b{display:block;font-size:22px;margin-top:4px}
.st i{font-style:normal;float:left;font-size:20px;opacity:.9}
.bar{display:flex;gap:8px;margin:14px 0 8px}
input,select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--b);background:var(--in);color:var(--t);font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);outline-offset:-1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--m);font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent}
.u{padding:var(--pad);margin:10px 0}
.top{display:flex;align-items:center;gap:11px}
.av{width:42px;height:42px;border-radius:var(--avr);display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2))}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--m)}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:700}
.ok{background:#1fa86a33;color:#35d68a}.no{background:#e5484d33;color:#ff7a80}.off{background:#8d95b033;color:var(--m)}
.pb{height:8px;border-radius:9px;background:var(--in);margin:12px 0 6px;overflow:hidden}
.pb div{height:100%;border-radius:9px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--m)}
.act{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:64px;padding:9px 6px;border-radius:11px;border:1px solid var(--b);background:var(--c2);color:var(--t);font-size:13px;cursor:pointer;font-family:inherit}
.btn.p{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;color:#fff;font-weight:700}
.btn.d{color:#ff7a80}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;height:56px;padding:0 22px;border-radius:99px;border:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 55%,transparent)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
.mo.on{display:flex}
.sh{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--b);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.mo{align-items:center}.sh{border-radius:24px}}
.sh h3{margin:0 0 12px}label{display:block;font-size:12.5px;color:var(--m);margin:11px 0 5px}
.row{display:flex;gap:10px}.row>*{flex:1}
#qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:16px;margin:8px auto;width:fit-content}
.lk{font-size:11.5px;word-break:break-all;color:var(--m);background:var(--in);padding:9px;border-radius:10px;margin-top:6px;direction:ltr;text-align:left}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;z-index:50;transition:.3s}
#toast.on{transform:translateX(-50%)}
.empty{text-align:center;color:var(--m);padding:40px 0}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
#grain{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.08;mix-blend-mode:overlay;display:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body[data-ns="1"] #grain{display:block}
header{position:sticky;top:0;z-index:15;margin:-14px -14px 12px;padding:12px 14px;-webkit-backdrop-filter:blur(var(--bl));backdrop-filter:blur(var(--bl));background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--b)}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mh h3{margin:0}.mh small{color:var(--m)}
.mi{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--a),var(--a2))}
.x{margin-inline-start:auto;width:38px;height:38px;flex:none;border-radius:12px;border:1px solid var(--b);background:var(--c2);color:var(--t);cursor:pointer;font-size:16px}
.sec{border:1px solid var(--b);background:var(--c);border-radius:var(--r);padding:12px;margin:10px 0}
.sec h4{margin:0 0 8px;font-size:14px}
.sumc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:var(--r);border:1px solid var(--b);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 16%,transparent),color-mix(in srgb,var(--a2) 10%,transparent))}
.sumc div{text-align:center}.sumc b{display:block;font-size:16px}.sumc small{color:var(--m);font-size:11px}
.sumc .wide{grid-column:1/-1;border-top:1px dashed var(--b);padding-top:8px}
.ptiles,.tpls,.lks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lks{grid-template-columns:repeat(3,1fr)}
.pt,.tp{padding:11px;border:1.5px solid var(--b);border-radius:14px;cursor:pointer;background:var(--in);position:relative}
.pt b,.tp b{display:block}.pt small,.tp small{color:var(--m);font-size:11.5px}
.pt.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 15%,transparent)}
.pt.on::after{content:"✓";position:absolute;top:6px;left:9px;color:var(--a);font-weight:900}
.lk2{padding:15px 8px;border-radius:14px;color:#fff;font-weight:800;text-align:center;cursor:pointer;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw2{width:48px;height:27px;border-radius:99px;background:var(--in);border:1px solid var(--b);position:relative;cursor:pointer;flex:none;transition:.25s}
.sw2 i{position:absolute;top:2px;right:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.25s}
.sw2.on{background:var(--a)}.sw2.on i{right:24px}
.big{font-size:22px;font-weight:800;text-align:center}
input[type=range]{accent-color:var(--a);padding:0;margin-top:8px}
.stk{position:sticky;bottom:-18px;margin:14px -18px -18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 38%)}
.ats{display:none;margin-top:8px;padding:9px 12px;border-radius:12px;font-size:13px}
.ats.ok,.ats.bad,.ats.run{display:block}
.ats.ok{background:#1fa86a33;color:#35d68a}.ats.bad{background:#e5484d33;color:#ff7a80}.ats.run{background:var(--in);color:var(--m)}
</style>
</head>
<body data-bg="gradient" data-an="on">
<canvas id="fx"></canvas><div id="grain"></div>
<div class="w">
  <header>
    <h1 id="ttl">👑 KING_PANNEL</h1>
    <button class="ic" onclick="openDiag()" title="عیب‌یابی">🩺</button>
    <button class="ic" onclick="openSet()" title="تنظیمات">⚙️</button>
    <button class="ic" onclick="location='/logout'" title="خروج">🚪</button>
  </header>

  <div class="stats">
    <div class="card st"><i>👥</i><small>کل کاربران</small><b id="s1">–</b></div>
    <div class="card st"><i>✅</i><small>فعال</small><b id="s2">–</b></div>
    <div class="card st"><i>📊</i><small>کل مصرف</small><b id="s3">–</b></div>
    <div class="card st"><i>🖥️</i><small>بار سرور</small><b id="s4">–</b></div>
  </div>

  <div id="errb" class="ats" style="margin-top:10px"></div>
  <div class="bar"><input id="q" placeholder="🔎 جستجوی کاربر یا یادداشت..." oninput="render()"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<button class="fab" onclick="openUser()">＋ کاربر جدید</button>

<div class="mo" id="mu" onclick="if(event.target===this)cl('mu')"><div class="sh" id="mub"></div></div>
<div class="mo" id="mq" onclick="if(event.target===this)cl('mq')"><div class="sh" id="mqb" style="text-align:center"></div></div>
<div class="mo" id="ms" onclick="if(event.target===this)closeSet()"><div class="sh" id="sb"></div></div>
<div class="mo" id="mc"><div class="sh" id="mcb"></div></div>
<div class="mo" id="md" onclick="if(event.target===this)cl('md')"><div class="sh" id="mdb"></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(r.status===401){location='/login';throw 0}return r.json()};
const GB=1073741824,fb=x=>x>=GB?(x/GB).toFixed(2)+' GB':(x/1048576).toFixed(1)+' MB';
const COLORS=['#7c5cff','#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#a855f7'];
let users=[],S={},filt='all',editId=null,qs='',qv='';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}
function cl(id){$(id).classList.remove('on')}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('✅ کپی شد')}

const FONTS={system:'system-ui,Tahoma,sans-serif',vazir:'Vazirmatn,Tahoma,sans-serif',tahoma:'Tahoma,sans-serif',mono:'ui-monospace,Menlo,monospace'};
const PAL={amoled:['#000000','#f2f2f7','#8a8a93','rgba(255,255,255,.1)','dark'],nord:['#2e3440','#eceff4','#9aa5b8','rgba(255,255,255,.12)','dark'],dracula:['#1e1f29','#f8f8f2','#9aa0c0','rgba(255,255,255,.12)','dark'],abyss:['#04121f','#e6f4ff','#7fa3bf','rgba(120,190,255,.16)','dark'],paper:['#f7f5ef','#1d1b16','#6f6a5c','#e5e0d2','light']};
function applyTheme(T=S){window.__T=T;const r=document.documentElement,st=r.style,d=document.body.dataset,P=PAL[T.palette];
 st.setProperty('--a',T.accent);st.setProperty('--a2',T.accent2);st.setProperty('--r',T.radius+'px');
 st.setProperty('--fs',T.fsize+'px');st.setProperty('--bl',T.blur+'px');st.setProperty('--ff',FONTS[T.font]||FONTS.system);
 st.setProperty('--avr',{circle:'50%',squircle:'13px',square:'4px'}[T.shape]||'13px');
 let t=P?P[4]:T.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';r.dataset.t=t;
 ['--bg','--t','--m','--b'].forEach((k,i)=>P?st.setProperty(k,P[i]):st.removeProperty(k));
 st.setProperty('--c',t==='dark'?`rgba(255,255,255,${.02+T.opacity*.0018})`:`rgba(255,255,255,${.4+T.opacity*.006})`);
 Object.assign(d,{bg:T.bg,cs:T.cardstyle,ly:T.layout,d:T.density,an:T.anim==='0'?'off':'on',bd:T.border||'normal',hv:T.hover||'lift',sp:T.spot??'1',tf:T.titlefx||'gradient',bt:T.btn||'gradient',en:T.enter||'fade',ns:T.noise||'0'});
 $('ttl').innerHTML='👑 KING_PANNEL';document.title='KING_PANNEL';
 fx(T.fx||'none',T.accent+'|'+T.accent2)}
let FXk='',FXr=0,rz;
function fx(mode,col){const k=mode+col+(document.body.dataset.an||'');if(k===FXk)return;FXk=k;cancelAnimationFrame(FXr);
 const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;x.clearRect(0,0,c.width,c.height);
 if(mode==='none'||document.body.dataset.an==='off'||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const [a,b]=col.split('|'),W=c.width,H=c.height,R=Math.random,
 P=Array.from({length:mode==='bubbles'?28:70},()=>({x:R()*W,y:R()*H,r:R()*2+.6,v:R()*.7+.25,p:R()*6.28}));let t=0,last=0;
 const loop=ts=>{FXr=requestAnimationFrame(loop);if(ts-last<33)return;last=ts;t+=.03;
  x.clearRect(0,0,W,H);
  P.forEach(p=>{
   if(mode==='stars'){x.globalAlpha=.35+.65*Math.abs(Math.sin(t+p.p));x.fillStyle=p.r>1.8?b:'#fff';x.beginPath();x.arc(p.x,p.y,p.r*.8,0,6.28);x.fill();p.x-=p.v*.1;if(p.x<0)p.x=W}
   else if(mode==='snow'){x.globalAlpha=.8;x.fillStyle='#fff';x.beginPath();x.arc(p.x+Math.sin(t+p.p)*12,p.y,p.r*1.3,0,6.28);x.fill();p.y+=p.v*1.4;if(p.y>H)p.y=-5}
   else{x.globalAlpha=.4;x.strokeStyle=b;x.lineWidth=1.2;x.beginPath();x.arc(p.x+Math.sin(t+p.p)*8,p.y,p.r*5,0,6.28);x.stroke();p.y-=p.v*1.1;if(p.y<-20)p.y=H+10}});
  x.globalAlpha=1};
 FXr=requestAnimationFrame(loop)}
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{FXk='';applyTheme(window.__T||S)},300)});

const PN={vmess:'VMess',vless:'VLESS',trojan:'Trojan',vlessh:'VLESS-HU'};
function render(){
 const q=$('q').value.trim().toLowerCase(),now=Date.now()/1000;
 const F={all:u=>1,active:u=>u.active,expired:u=>u.expire&&u.expire<now,off:u=>!u.enabled,full:u=>u.limit_bytes&&u.up+u.down>=u.limit_bytes};
 const N={all:'همه',active:'فعال',expired:'منقضی',full:'حجم تمام',off:'غیرفعال'};
 $('chips').innerHTML=Object.keys(N).map(k=>`<div class="chip ${filt===k?'on':''}" onclick="filt='${k}';render()">${N[k]} (${users.filter(F[k]).length})</div>`).join('');
 const L=users.filter(F[filt]).filter(u=>!q||(u.name+' '+u.note).toLowerCase().includes(q));
 $('list').innerHTML=L.length?L.map(u=>{
  const used=u.up+u.down,p=u.limit_bytes?Math.min(100,used/u.limit_bytes*100):0;
  const col=p<70?'#22c55e':p<90?'#f59e0b':'#ef4444';
  const days=u.expire?Math.ceil((u.expire-now)/86400):null;
  const exp=u.ttl_days&&!u.expire?'⏳ اولین اتصال ('+u.ttl_days+' روز)':days===null?'♾️ نامحدود':days<=0?'⛔ منقضی':days+' روز مانده';
  const tag=!u.enabled?['off','غیرفعال']:u.active?['ok','فعال']:['no','تمام شده'];
  return `<div class="card u"><div class="top"><div class="av">${esc(u.name[0]||'?')}</div>
  <div class="nm"><b>${esc(u.name)}</b><small>${u.protos.split(',').map(p=>PN[p]||p).join(' · ')} · ${u.port}${u.note?' · '+esc(u.note):''}</small></div><span class="tag ${tag[0]}">${tag[1]}</span></div>
  <div class="pb"><div style="width:${u.limit_bytes?p:100}%;background:${col};${u.limit_bytes?'':'opacity:.35'}"></div></div>
  <div class="meta"><span>${fb(used)} / ${u.limit_bytes?fb(u.limit_bytes):'♾️'}</span><span>${exp}</span></div>
  <div class="meta" style="margin-top:3px"><span>↑ ${fb(u.up)}</span><span>↓ ${fb(u.down)}</span></div>
  <div class="act"><button class="btn p" onclick="qr(${u.id})">📲 لینک</button>
  <button class="btn" onclick="cp(location.origin+'/sub/${u.token}')">🔗 ساب</button>
  <button class="btn" onclick="openUser(${u.id})">✏️</button>
  <button class="btn" onclick="up(${u.id},{enabled:${!u.enabled}})">${u.enabled?'⏸':'▶️'}</button>
  <button class="btn" onclick="ask('مصرف صفر شود؟').then(y=>y&&up(${u.id},{reset:true}))">♻️</button>
  <button class="btn d" onclick="rm(${u.id})">🗑</button></div></div>`}).join(''):'<div class="empty"><div style="font-size:48px">👑</div><p>هیچ کاربری یافت نشد</p></div>'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
 [users,S]=await Promise.all([api('GET','/api/users'),api('GET','/api/settings')]);applyTheme();render();
 const s=await api('GET','/api/stats');
 $('s1').textContent=s.users;$('s2').textContent=s.active;$('s3').textContent=fb(s.traffic);
 $('s4').textContent=Math.round(s.ram_used/s.ram_total*100)+'%'}

const PROTOS=[['vmess','VMess','🔷'],['vless','VLESS','⚡'],['trojan','Trojan','🛡️'],['vlessh','VLESS-HU','🚀']];
const PORTS=[['443','443 TLS'],['80','80 بدون TLS'],['2053','2053']];
const TPL=[['🧪','تست','۱ گیگ · ۱ روز',1,1],['📅','ماهانه','۵۰ گیگ · ۳۰ روز',50,30],['💎','سه‌ماهه','۱۵۰ گیگ · ۹۰ روز',150,90]];
const chip=(g,v,t,on)=>`<div class="chip ${on?'on':''}" data-g="${g}" data-v="${v}" onclick="tg(this)">${t}</div>`;
const gv=g=>[...document.querySelectorAll(`#mub [data-g=${g}].on`)].map(x=>x.dataset.v);
function tg(e){const g=e.dataset.g;if(['proto','first','en'].includes(g))e.classList.toggle('on');else{document.querySelectorAll(`#mub [data-g=${g}]`).forEach(x=>x.classList.remove('on'));e.classList.add('on')}sum()}
const setv=(i,v)=>{$(i).value=v;sum()};
const rnd=()=>Math.random().toString(36).slice(2,8);
const qc=(id,arr,suf)=>`<div class="chips wrap" style="margin-top:8px">${arr.map(x=>`<div class="chip" onclick="setv('${id}',${x})">${x?x+suf:'♾️'}</div>`).join('')}</div>`;
const swc=(g,on,t)=>`<div class="rw"><span>${t}</span><div class="sw2 ${on?'on':''}" data-g="${g}" data-v="1" onclick="tg(this)"><i></i></div></div>`;
function sum(){if(!$('sum'))return;const gb=+$('fg').value||0,d=+$('fd').value||0,P=gv('proto'),n=+($('fc')?$('fc').value:1)||1;
 $('sum').innerHTML=`<div><b>${P.length}</b><small>پروتکل</small></div><div><b>${gb?gb+' GB':'♾️'}</b><small>حجم</small></div><div><b>${d?d+' روز':'♾️'}</b><small>مدت</small></div><div><b>${gv('port')[0]||443}</b><small>پورت</small></div>`}

function openUser(id){editId=id||null;const u=users.find(x=>x.id===id),E=!!u,ps=E?u.protos.split(','):['vmess'];
 const gb0=E?+(u.limit_bytes/GB).toFixed(2):0,d0=E&&u.expire?Math.max(0,Math.ceil((u.expire-Date.now()/1000)/86400)):0;
 $('mub').innerHTML=`<div class="mh"><div class="mi">${E?'✏️':'✨'}</div><div><h3>${E?'ویرایش کاربر':'ساخت کانفیگ جدید'}</h3><small>سرعت بالا و آنی</small></div><button class="x" onclick="cl('mu')">✕</button></div>
 <div class="sumc" id="sum"></div>
 ${E?'':`<div class="sec"><h4>⚡ قالب‌های آماده</h4><div class="tpls">${TPL.map(t=>`<div class="tp" onclick="setv('fg',${t[3]});setv('fd',${t[4]})"><b>${t[0]} ${t[1]}</b><small>${t[2]}</small></div>`).join('')}</div></div>`}
 <div class="sec"><h4>👤 هویت</h4><div class="row"><input id="fn" placeholder="نام کاربر" value="${E?esc(u.name):''}"><button class="btn" style="flex:0 0 52px" onclick="$('fn').value='user-'+rnd()">🎲</button></div>
 <textarea id="fnote" rows="2" placeholder="یادداشت" style="margin-top:8px">${E?esc(u.note):''}</textarea></div>
 <div class="sec"><h4>🔌 پروتکل‌ها</h4><div class="ptiles">${PROTOS.map(([v,t,ic])=>`<div class="pt ${ps.includes(v)?'on':''}" data-g="proto" data-v="${v}" onclick="tg(this)"><b>${ic} ${t}</b></div>`).join('')}</div></div>
 <div class="sec"><h4>📦 حجم (GB)</h4><input id="fg" class="big" type="number" min="0" value="${gb0}">${qc('fg',[1,10,30,50,100,0],' GB')}</div>
 <div class="sec"><h4>⏱️ مدت (روز)</h4><input id="fd" class="big" type="number" min="0" value="${d0}">${qc('fd',[1,7,30,90,0],' روز')}
 ${E?'':swc('first',false,'⏳ شروع از اولین اتصال')}</div>
 <div class="sec"><h4>🌐 اتصال</h4><div class="chips wrap">${PORTS.map(([v,t])=>chip('port',v,t,String(E?u.port:443)===v)).join('')}</div></div>
 <div class="act stk"><button class="btn p" onclick="saveUser()">${E?'💾 ذخیره فوری':'🚀 ساخت کانفیگ'}</button><button class="btn" onclick="cl('mu')">بستن</button></div>`;
 $('mu').classList.add('on');sum()}

async function saveUser(){
 const E=!!editId,b={name:$('fn').value||'user',gb:+$('fg').value||0,days:+$('fd').value||0,note:$('fnote').value,
 protos:gv('proto'),port:+(gv('port')[0]||443),fp:'',addr:'',enabled:!!gv('en',true).length};
 if(!b.protos.length)return toast('⚠️ پروتکل انتخاب کن');
 if(!E){b.first_use=!!gv('first').length;b.count=1;b.uuid=''}
 await api(E?'PUT':'POST',E?'/api/users/'+editId:'/api/users',b);
 cl('mu');toast('✅ با موفقیت ذخیره شد');await load();
}

async function up(i,b){await api('PUT','/api/users/'+i,b);await load();toast('✅ اعمال شد')}
async function rm(i){if(confirm('حذف شود؟')){await api('DELETE','/api/users/'+i);await load();toast('🗑️ حذف شد')}}
let QL=[],QI=0;
function qr(id){const u=users.find(x=>x.id===id);qs=location.origin+'/sub/'+u.token;QL=[{p:'sub',l:qs},...u.links];
 $('mqb').innerHTML=`<div class="mh"><div class="mi">📲</div><div style="text-align:right"><h3>${esc(u.name)}</h3></div><button class="x" onclick="cl('mq')">✕</button></div>
 <div class="chips wrap" style="justify-content:center" id="qtabs">${QL.map((x,i)=>`<div class="chip" onclick="showT(${i})">${x.p==='sub'?'🔗 ساب':PN[x.p]}</div>`).join('')}</div>
 <div id="qr"></div><div class="lk" id="ql"></div>
 <div class="act stk"><button class="btn p" onclick="cp(QL[QI].l)">📋 کپی لینک</button></div>`;
 $('mq').classList.add('on');showT(0)}
function showT(i){QI=i;document.querySelectorAll('#qtabs .chip').forEach((c,j)=>c.classList.toggle('on',j===i));showQ(QL[i].l)}
function showQ(t){$('qr').innerHTML='';$('ql').textContent=t;if(window.QRCode)new QRCode($('qr'),{text:t,width:200,height:200})}

const PRE={midnight:['#7c5cff','#38d4ff','نیمه‌شب'],ocean:['#0ea5e9','#22d3ee','اقیانوس'],aurora:['#10b981','#6366f1','شفق'],sunset:['#f97316','#ec4899','غروب'],mono:['#94a3b8','#e2e8f0','مونو']};
const OPT={theme:[['dark','تیره'],['light','روشن'],['auto','خودکار']],
 palette:[['default','پیش‌فرض'],['amoled','آمولد سیاه'],['nord','نورد'],['dracula','دراکولا'],['abyss','اعماق دریا'],['paper','کاغذ (روشن)']],
 bg:[['gradient','گرادیانت'],['mesh','مش'],['aurora','شفق متحرک'],['grid','شبکه'],['plain','ساده']],
 fx:[['none','بدون'],['stars','ستاره‌ها'],['snow','برف']],
 cardstyle:[['glass','شیشه‌ای'],['solid','تخت'],['outline','خط‌دار'],['neon','نئون']],
 layout:[['list','لیستی'],['grid','شبکه‌ای']]};
const DEF={accent:'#7c5cff',accent2:'#38d4ff',theme:'dark',palette:'default',radius:'16',bg:'gradient',fx:'none',noise:'0',cardstyle:'glass',layout:'list'};
const g=k=>S[k]??DEF[k];

function openSet(){
 $('sb').innerHTML=`<div class="mh"><div class="mi">⚙️</div><div><h3>تنظیمات و ظاهر</h3><small>شخصی‌سازی کامل KING_PANNEL</small></div><button class="x" onclick="closeSet()">✕</button></div>
 <label>رنگ‌های آماده</label><div class="chips" style="margin-bottom:12px">${Object.entries(PRE).map(([k,[a,b,n]])=>`<div class="chip" style="background:linear-gradient(135deg,${a},${b});color:#fff" onclick="pre('${k}')">${n}</div>`).join('')}</div>
 <label>دامنه سرور (Railway)</label><input id="s_domain" dir="ltr" value="${esc(S.domain||S.default_domain)}">
 <label>پیشوند نام کانفیگ‌ها</label><input id="s_prefix" value="${esc(S.prefix)}">
 <div class="act stk" style="margin-top:20px"><button class="btn p" onclick="saveSet()">💾 ذخیره تنظیمات</button><button class="btn" onclick="closeSet()">بستن</button></div>`;
 $('ms').classList.add('on');}
function pre(k){S.accent=PRE[k][0];S.accent2=PRE[k][1];applyTheme()}
function closeSet(){cl('ms');applyTheme()}
async function saveSet(){
 const b={domain:$('s_domain').value,prefix:$('s_prefix').value};
 await api('PUT','/api/settings',b);cl('ms');toast('✅ تنظیمات ذخیره شد');await load()
}

async function openDiag(){
 $('mdb').innerHTML=`<div class="mh"><div class="mi">🩺</div><div><h3>وضعیت هسته</h3><small>Xray Core Status</small></div><button class="x" onclick="cl('md')">✕</button></div><div id="dgb" class="ats run">⏳ در حال بررسی...</div>`;$('md').classList.add('on');
 const d=await api('GET','/api/diag');
 $('dgb').outerHTML=`<div class="sec">وضعیت Xray: <b>${d.alive?'🟢 فعال و آنلاین':'🔴 متوقف'}</b></div>`;
}

load();setInterval(load, 15000);
</script>
</body>
</html>
